kind: fixed
body: 'The command error classifier no longer guesses an error''s category from its message text — a fragile heuristic that misrouted some validation errors to the wrong exit code. A bad `auth_type` (rejected on config load or via `config set`) and `auth login` with the conflicting `--secret-stdin` and `--credential-env` flags now exit 3 (validation) instead of 1 (auth), where before the word "auth" or the flag name "credential-env" pushed them onto the authentication path. Multi-key batch commands that partially fail now carry the exit code of their worst failure directly instead of re-deriving it from the summary line, so mixed-failure batches classify correctly. Any error the CLI does not explicitly classify now defaults to validation (exit 3) rather than being sorted by keyword.'
