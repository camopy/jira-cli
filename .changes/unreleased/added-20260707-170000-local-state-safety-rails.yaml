kind: added
body: 'The `--dry-run`/`--force` safety rails now cover local state mutations, not just Jira writes. `cache clear --dry-run` reports what a live clear would remove without touching any file, `config set --dry-run` runs the full key and value validation and reports the current and new value without writing config, `auth switch --dry-run` resolves the target profile without changing the default, and `auth logout --dry-run` names the credential a live logout would revoke without opening the secret backend. The destructive pair — `cache clear` and `auth logout` — now requires `--force` in agent, non-TTY, or `--no-input` context, matching the gate on destructive Jira mutations; headless scripts that clear caches or log out must add the flag. Interactive terminals proceed without prompts.'
