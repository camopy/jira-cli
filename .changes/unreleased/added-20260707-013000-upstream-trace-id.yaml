kind: added
body: 'The JSON envelope now carries Jira''s own trace id: the `Atl-Traceid` / `X-ARequestId` response header is captured as `meta.upstream_request_id` and on each error entry, so a Jira-side failure can be quoted directly to Atlassian support. The existing `meta.request_id` is generated locally and has no server-side meaning.'
time: 2026-07-07T01:30:00.000000-04:00
