kind: fixed
body: Honor a named theme set in config (e.g. `dracula`, `nord`) in plain command output — tables and the `release-notes` view — instead of falling back to the dark palette; previously only the opt-in `auto` theme (or `JIRA_THEME`) styled non-TUI output.
