kind: fixed
body: 'Locally-detected command errors now carry typed classifications instead of being guessed from their message text, which fixes five wrong exit codes. `auth login` with a `--backend` that differs from the profile''s stored backend, and `issue edit --assignee me` on a profile with no saved account id, now exit 3 (validation, `flag_value_invalid`) instead of 1 (auth). `auth whoami` against a profile that has no base URL now exits 2 (`profile_incomplete`) instead of 1 (auth). `jira agent guide` with an unknown section and `jira search saved` with an unknown query name now exit 3 (validation, `arg_value_invalid`) instead of 2 (not found) — the lookups are local, not Jira resources. Every `--force` gate keeps its `validation_failed`/exit 3 contract, and a genuinely absent Jira user on watcher commands keeps `not_found`/exit 2.'
time: 2026-07-07T19:00:00.000000-04:00
