- id: issue.create.minimal
  command: jira issue create
  covered: true
  kind: mutating
  cleanup: delete
  notes: Creates a minimal disposable issue with project, issue type, and summary.
- id: issue.create.description
  command: jira issue create
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Creates the survivor issue with a Markdown description that is converted to ADF by the CLI.
- id: issue.create.dry_run
  command: jira issue create
  covered: true
  kind: mutating
  cleanup: none
  notes: Runs create with --dry-run and verifies no live issue appears for the dry-run summary.
- id: issue.view
  command: jira issue view
  covered: true
  kind: read
  cleanup: none
  notes: Reads created issues back through the binary JSON envelope.
- id: issue.edit.summary
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Updates the survivor summary while preserving the live-test marker.
- id: issue.edit.description
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Updates the survivor description with a native ADF document via --json-input.
- id: issue.edit.fields
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Exercises arbitrary fields through --json-input using labels.
- id: issue.edit.assignee
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Self-assigns using the authenticated user's accountId from auth whoami.
- id: issue.edit.unassign
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Clears assignee via --assignee none and verifies the issue is unassigned.
- id: issue.edit.labels
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Sets live-test labels and verifies them via issue view.
- id: issue.edit.dry_run
  command: jira issue edit
  covered: true
  kind: mutating
  cleanup: none
  notes: Runs edit with --dry-run and verifies the live issue summary is unchanged.
- id: issue.transition.list
  command: jira issue transition
  covered: true
  kind: read
  cleanup: none
  notes: Lists transitions at runtime to discover available transition IDs.
- id: issue.transition.execute
  command: jira issue transition
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Executes discovered transition IDs until the survivor reaches a closed-looking state.
- id: issue.comment.legacy_add
  command: jira issue comment
  covered: true
  kind: mutating
  cleanup: none
  notes: Exercises the legacy parent command alias for comment add, then deletes the comment.
- id: issue.comment.add
  command: jira issue comment add
  covered: true
  kind: mutating
  cleanup: none
  notes: Adds a comment to the survivor.
- id: issue.comment.list
  command: jira issue comment list
  covered: true
  kind: read
  cleanup: none
  notes: Lists comments and verifies the added comment is present.
- id: issue.comment.edit
  command: jira issue comment edit
  covered: true
  kind: mutating
  cleanup: none
  notes: Edits the suite-created comment.
- id: issue.comment.delete
  command: jira issue comment delete
  covered: true
  kind: destructive
  cleanup: none
  notes: Deletes only comments created by this suite run.
- id: issue.attachment.add
  command: jira issue attachment add
  covered: true
  kind: mutating
  cleanup: none
  notes: Uploads a small temporary text file to the survivor.
- id: issue.attachment.list
  command: jira issue attachment list
  covered: true
  kind: read
  cleanup: none
  notes: Lists attachments and verifies the uploaded attachment is present.
- id: issue.attachment.download
  command: jira issue attachment download
  covered: true
  kind: read
  cleanup: none
  notes: Downloads the uploaded attachment to a temporary path.
- id: issue.attachment.delete
  command: jira issue attachment delete
  covered: true
  kind: destructive
  cleanup: none
  notes: Deletes only the suite-created attachment by id.
- id: issue.link.create
  command: jira issue link
  covered: true
  kind: mutating
  cleanup: none
  notes: Creates a link between two suite-created issues using a link type discovered at runtime.
- id: issue.link.list
  command: jira issue link list
  covered: true
  kind: read
  cleanup: none
  notes: Lists survivor links and extracts the suite-created link id.
- id: issue.link.delete
  command: jira issue link delete
  covered: true
  kind: destructive
  cleanup: none
  notes: Deletes only the suite-created link id.
- id: issue.link.types
  command: jira issue link types
  covered: true
  kind: read
  cleanup: none
  notes: Discovers available Jira issue link types before creating a link.
- id: issue.watch
  command: jira issue watch
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Starts watching the survivor as the authenticated user.
- id: issue.unwatch
  command: jira issue unwatch
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Stops watching the survivor as the authenticated user.
- id: issue.watchers.list
  command: jira issue watchers list
  covered: true
  kind: read
  cleanup: none
  notes: Lists watchers after watch mutations.
- id: issue.watchers.add
  command: jira issue watchers add
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Adds only the authenticated user's own accountId as a watcher.
- id: issue.watchers.remove
  command: jira issue watchers remove
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Removes only the authenticated user's own accountId as a watcher.
- id: issue.weblink
  command: jira issue weblink
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Adds a suite-marked web link to the survivor; survivor is intentionally retained.
- id: issue.list
  command: jira issue list
  covered: true
  kind: read
  cleanup: none
  notes: Queries the project for the survivor issue and asserts it appears.
- id: issue.list.as_jql
  command: jira issue list
  covered: true
  kind: read
  cleanup: none
  notes: Exercises the issue list --as-jql command path.
- id: issue.mine
  command: jira issue mine
  covered: true
  kind: read
  cleanup: none
  notes: Runs the assigned-to-me issue listing after self-assignment.
- id: issue.clone
  command: jira issue clone
  covered: true
  kind: mutating
  cleanup: delete
  notes: Clones the survivor with a suite marker override and tracks the clone for safe deletion.
- id: issue.move
  command: jira issue move
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Exercises the issue move command by updating survivor fields through the move pipeline.
- id: issue.delete
  command: jira issue delete
  covered: true
  kind: destructive
  cleanup: none
  notes: Deletes a disposable suite-created issue only after re-reading and verifying the marker in its summary.
- id: worklog.add
  command: jira worklog add
  covered: true
  kind: mutating
  cleanup: survivor
  notes: Adds a short worklog with a Markdown comment to the survivor.
- id: worklog.list
  command: jira worklog list
  covered: true
  kind: read
  cleanup: none
  notes: Lists worklogs and asserts at least the suite-created worklog is visible.
